# /etc/nginx/sites-available/clinica
# Enlace simbólico: ln -s /etc/nginx/sites-available/clinica /etc/nginx/sites-enabled/clinica

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name tu-dominio.gt www.tu-dominio.gt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tu-dominio.gt www.tu-dominio.gt;

    # ── SSL — gestionado por Certbot (Let's Encrypt) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.gt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.gt/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad HTTP headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # ── Frontend estático (build de Vite) ─────────────────────────────────────
    # Opción A: servir desde el Droplet directamente
    root /var/www/clinica/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # SPA fallback
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Assets con hash en el nombre — cache agresivo
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API backend (proxy al container Docker) ───────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Timeouts generosos para operaciones largas (PDF, etc.)
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # Límite de body para subida de documentos (RF-13)
        client_max_body_size 12M;
    }

    # ── Health check (no logear) ──────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
