name: Deploy — Clínica Médica

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Tests backend ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       clinica_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Habilitar extensión UUID
        run: psql -h localhost -U postgres -d clinica_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
        env:
          PGPASSWORD: postgres

      - name: Generar Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinica_test

      - name: Ejecutar migraciones de prueba
        working-directory: backend
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinica_test

      - name: Seed de prueba
        working-directory: backend
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinica_test

      - name: Pruebas de seguridad
        working-directory: backend
        run: npx jest tests/seguridad.test.js --forceExit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinica_test
          JWT_SECRET: ci-secret-32-chars-minimum-here
          JWT_EXPIRES_IN: 30m
          NODE_ENV: test

  # ── Job 2: Build y push imagen Docker ────────────────────────────────────────
  build-image:
    name: Build imagen Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/clinica-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          

  # ── Job 3: Deploy frontend a DO Spaces ───────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → DO Spaces
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Build Vite
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Instalar s3cmd
        run: pip install s3cmd

      - name: Sync assets (cache largo)
        run: |
          s3cmd sync \
            --access_key="${{ secrets.DO_SPACES_KEY }}" \
            --secret_key="${{ secrets.DO_SPACES_SECRET }}" \
            --host="${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com" \
            --host-bucket="%(bucket)s.${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com" \
            --acl-public \
            --add-header="Cache-Control:public, max-age=31536000, immutable" \
            --exclude="index.html" --exclude="*.json" \
            frontend/dist/ \
            "s3://${{ secrets.DO_SPACES_BUCKET }}/"

      - name: Sync index.html (sin cache)
        run: |
          s3cmd sync \
            --access_key="${{ secrets.DO_SPACES_KEY }}" \
            --secret_key="${{ secrets.DO_SPACES_SECRET }}" \
            --host="${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com" \
            --host-bucket="%(bucket)s.${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com" \
            --acl-public \
            --add-header="Cache-Control:no-cache, no-store, must-revalidate" \
            --include="index.html" --include="*.json" \
            frontend/dist/ \
            "s3://${{ secrets.DO_SPACES_BUCKET }}/"

  # ── Job 4: Deploy API al Droplet ─────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Droplet
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key:      ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/clinica

            echo "▶ Pulling imagen más reciente..."
            docker compose -f docker-compose.prod.yml pull

            echo "▶ Reiniciando container..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "▶ Ejecutando migraciones pendientes..."
            docker exec clinica-api npx prisma migrate deploy

            echo "▶ Limpiando imágenes antiguas..."
            docker image prune -f

            echo "▶ Health check..."
            sleep 5
            curl -sf http://localhost:3000/health || (docker logs clinica-api --tail 50 && exit 1)

            echo "✓ Deploy completado."
