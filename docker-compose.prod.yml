services:
  api:
    image: ghcr.io/kennyasg/clinica-sistema/clinica-api:latest
    container_name: clinica-api
    restart: always
    env_file: /opt/clinica/.env.production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"