# docker-compose.yml — Entorno de DESARROLLO local
# Uso: docker compose up --build
# Incluye hot-reload del backend y PostgreSQL local.

services:

  db:
    image: postgres:16-alpine
    container_name: clinica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       clinica_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/clinica_db_creation.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinica_db
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload: monta el src local sobre el del container
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    command: node src/server.js

volumes:
  pgdata:
